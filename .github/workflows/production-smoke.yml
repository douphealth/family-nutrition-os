name: Production Smoke

# After a push to main, wait for GitHub Pages to publish THIS commit, then prove the
# live site is complete: the service worker carries this build's cache name, and every
# file the worker precaches (the whole offline app) is really being served.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for this build on GitHub Pages, then check every precached file
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://douphealth.github.io/family-nutrition-os"

          EXPECT="$(node -e "const s=require('fs').readFileSync('sw.js','utf8');console.log(/const CACHE = '([^']+)'/.exec(s)[1])")"
          node -e "const s=require('fs').readFileSync('sw.js','utf8');const c=/const CORE = \[([\s\S]*?)\];/.exec(s)[1];for(const m of c.matchAll(/'([^']+)'/g))console.log(m[1])" > /tmp/core.txt
          echo "expecting service-worker cache '$EXPECT' and $(wc -l < /tmp/core.txt) precached files"

          ok=0
          for i in $(seq 1 60); do
            if curl --fail --silent --location --max-time 15 --output /tmp/live-sw.js "$BASE/sw.js?probe=$i" && grep -q "$EXPECT" /tmp/live-sw.js; then ok=1; break; fi
            sleep 10
          done
          test "$ok" -eq 1 || { echo "the live site never served $EXPECT"; exit 1; }

          missing=0
          while read -r f; do
            url="$BASE/${f#./}"
            code="$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 15 "$url")"
            if [ "$code" != "200" ]; then echo "MISSING ($code): $url"; missing=1; fi
          done < /tmp/core.txt
          test "$missing" -eq 0

          curl --fail --silent --location --max-time 15 "$BASE/manifest.webmanifest" | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"
          curl --fail --silent --location --max-time 15 --output /dev/null "$BASE/assets/og-image.png"
          echo "Live GitHub Pages smoke test: PASS ($EXPECT)"
