name: Production Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for and validate live GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://douphealth.github.io/family-nutrition-os"
          ok=0
          for i in $(seq 1 36); do
            if curl --fail --silent --show-error --location --max-time 15 "$BASE/" -o /tmp/index.html \
              && grep -q 'ZENITH PRO' /tmp/index.html \
              && grep -q 'type="module" src="src/app.js"' /tmp/index.html \
              && curl --fail --silent --show-error --location --max-time 15 "$BASE/src/app.js" -o /tmp/app.js \
              && grep -q 'localDateKey' /tmp/app.js \
              && grep -q 'openCook' /tmp/app.js \
              && grep -q 'shopFilter' /tmp/app.js \
              && curl --fail --silent --show-error --location --max-time 15 "$BASE/src/views.js" -o /tmp/views.js \
              && grep -q 'todayView' /tmp/views.js \
              && grep -q 'cookBody' /tmp/views.js \
              && grep -q 'personaCard' /tmp/views.js \
              && grep -q 'kpi-row' /tmp/views.js \
              && grep -q 'shop-chip' /tmp/views.js \
              && curl --fail --silent --show-error --location --max-time 15 "$BASE/src/ui.js" -o /tmp/ui.js \
              && grep -q 'openSheet' /tmp/ui.js \
              && grep -q 'illustration' /tmp/ui.js \
              && grep -q 'kpi-bar' /tmp/ui.js \
              && grep -q 'aria-valuenow' /tmp/ui.js \
              && curl --fail --silent --show-error --location --max-time 15 "$BASE/src/nutrition-engine.js" -o /tmp/engine.js \
              && grep -q 'personaPoints' /tmp/engine.js \
              && grep -q 'trainingFueling' /tmp/engine.js \
              && grep -q 'householdServings' /tmp/engine.js \
              && grep -q 'memberShare' /tmp/engine.js \
              && grep -q 'upgradeMemberNames' /tmp/engine.js \
              && curl --fail --silent --show-error --location --max-time 15 "$BASE/src/data.js" -o /tmp/data.js \
              && grep -q 'Αναστασία' /tmp/data.js \
              && grep -q 'Δημήτρης' /tmp/data.js \
              && curl --fail --silent --show-error --location --max-time 15 "$BASE/styles/app.css" -o /tmp/app.css \
              && grep -q 'cook-cols' /tmp/app.css \
              && grep -q 'why-body' /tmp/app.css \
              && grep -q 'kpi-row' /tmp/app.css \
              && grep -q 'kpi-foot' /tmp/app.css \
              && curl --fail --silent --show-error --location --max-time 15 "$BASE/manifest.webmanifest" -o /tmp/manifest.webmanifest \
              && node -e "JSON.parse(require('fs').readFileSync('/tmp/manifest.webmanifest','utf8'))"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo "Live GitHub Pages smoke test: PASS (v4 bundle is being served)"
