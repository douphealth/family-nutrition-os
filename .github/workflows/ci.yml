name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Verify required PWA files
        run: test -f index.html && test -f manifest.webmanifest && test -f sw.js && test -f src/app.js && test -f src/nutrition-engine.js && test -f src/storage.js
