name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Unit, data-integrity and persona suites
        run: npm test

      - name: Syntax check application modules
        run: npm run check

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); JSON.parse(require('fs').readFileSync('package.json','utf8'));"

      - name: Verify required PWA files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f styles/app.css
          test -f src/app.js
          test -f src/data.js
          test -f src/ui.js
          test -f src/views.js
          test -f src/nutrition-engine.js
          test -f src/storage.js

      - name: Verify critical app wiring
        run: |
          grep -q 'type="module" src="src/app.js"' index.html
          grep -q 'styles/app.css' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'lang="el"' index.html
          grep -q "./src/storage.js" sw.js
          grep -q "./src/views.js" sw.js
          grep -q "./src/ui.js" sw.js

      - name: Verify service-worker strategy
        run: |
          # v3+ must be network-first for navigation (v2 was cache-first, which is
          # why deploys could appear stale) and stale-while-revalidate for assets.
          # Version-agnostic on the cache name so a routine bump does not fail CI.
          grep -q "CACHE = 'zenith-v" sw.js
          grep -q "req.mode === 'navigate'" sw.js
          grep -q "caches.open(CACHE)" sw.js

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install dev-only test dependencies
        run: npm install --no-audit --no-fund

      - name: DOM smoke test — localStorage fallback
        run: node scripts/smoke_dom.mjs

      - name: DOM smoke test — IndexedDB path
        run: node scripts/smoke_dom.mjs --idb

  # jsdom has no layout engine, so nothing above can catch a mobile layout
  # regression. This job renders the real app in Chromium at phone width and
  # asserts no horizontal overflow, thumb-sized tap targets, a pinned Cook Mode
  # step nav, and a shopping header that does not collapse into its buttons.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Serve the app
        run: |
          python -m http.server 8137 --bind 127.0.0.1 &
          for i in $(seq 1 20); do
            curl -fsS --max-time 3 http://127.0.0.1:8137/index.html >/dev/null && break
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8137/index.html >/dev/null

      - name: Mobile layout audit
        run: python scripts/capture_mobile.py http://127.0.0.1:8137/index.html /tmp/mobile-shots

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: /tmp/mobile-shots
          if-no-files-found: ignore
