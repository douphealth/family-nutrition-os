name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Logic: no browser needed ────────────────────────────────────────────────
  test:
    name: Tests, food-data provenance, PWA integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: Syntax-check every module, script and test
        run: npm run check

      - name: Unit, provenance, menu and reference suites
        run: npm test

      # A plan that shifts by a day when the clocks change, or in another country, is a bug
      # no unit test in one timezone can see.
      - name: The same suites in two more timezones
        run: |
          TZ=Pacific/Auckland npm test
          TZ=America/Los_Angeles npm test

      - name: PWA integrity — precache, manifest, versions, CSP
        run: npm run verify:pwa

  # ── The DOM without a layout engine: both storage backends ─────────────────
  smoke:
    name: DOM smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: localStorage fallback
        run: node scripts/smoke_dom.mjs
      - name: IndexedDB path
        run: node scripts/smoke_dom.mjs --idb
      - name: IndexedDB path, far from Athens
        run: TZ=America/Los_Angeles node scripts/smoke_dom.mjs --idb

  # ── The real app in a real Chromium ─────────────────────────────────────────
  # jsdom cannot see layout or contrast. This renders the app on a phone and on a desktop, in
  # light and dark, for every view and overlay, and fails on: horizontal overflow, touch targets
  # under 36 px, any axe-core violation, or any text run below WCAG AA contrast measured from
  # rendered pixels. Branches get the quick matrix; main gets the full one.
  browser:
    name: Browser audits — layout, accessibility, contrast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install Playwright and image libraries
        run: |
          python -m pip install --upgrade pip
          pip install playwright numpy pillow
          python -m playwright install --with-deps chromium

      - name: Choose audit depth
        id: depth
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--quick" >> "$GITHUB_OUTPUT"
          fi

      - name: Serve the app
        run: |
          node scripts/serve.mjs 8137 &
          for i in $(seq 1 20); do
            curl -fsS --max-time 3 http://127.0.0.1:8137/index.html >/dev/null && break
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8137/index.html >/dev/null

      - name: Verify the layout audit can fail
        run: python scripts/verify_audit.py http://127.0.0.1:8137/index.html

      - name: Mobile layout audit
        run: python scripts/capture_mobile.py http://127.0.0.1:8137/index.html /tmp/mobile-shots

      - name: Accessibility audit (axe-core, WCAG 2.2 AA)
        run: python scripts/audit_a11y.py http://127.0.0.1:8137/index.html ${{ steps.depth.outputs.flag }}

      - name: Contrast audit (measured from rendered pixels)
        run: python scripts/audit_contrast.py http://127.0.0.1:8137/index.html ${{ steps.depth.outputs.flag }} --crops /tmp/contrast-crops

      - name: Upload screenshots and contrast crops
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-evidence
          path: |
            /tmp/mobile-shots
            /tmp/contrast-crops
          if-no-files-found: ignore
