name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Syntax check application modules
        run: |
          node --check src/app.js
          node --check src/data.js
          node --check src/nutrition-engine.js
          node --check src/storage.js
          node --check sw.js
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); JSON.parse(require('fs').readFileSync('package.json','utf8'));"
      - name: Verify required PWA files
        run: test -f index.html && test -f manifest.webmanifest && test -f sw.js && test -f styles/app.css && test -f src/app.js && test -f src/data.js && test -f src/nutrition-engine.js && test -f src/storage.js
      - name: Verify critical app wiring
        run: |
          grep -q 'type="module" src="src/app.js"' index.html
          grep -q 'styles/app.css' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q "./src/storage.js" sw.js
