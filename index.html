<style>
/* ===== ZENITH PRO · Velvet OLED / Glass / Accent identity — v12 ===== */
:root{
--sans:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
--bg:#05070B;--glass:rgba(15,23,42,.55);--b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.14);--b3:rgba(255,255,255,.28);
--sheen:inset 0 1px 0 rgba(255,255,255,.08);--lift:0 24px 60px -22px rgba(0,0,0,.8);
--ink:#F2F6FF;--mut:#9AA8C0;--dim:#5D6B85;--water:#38BDF8;
--mp:#E1677C;--mc:#E5B04C;--mf:#5A8FD8;
--ac:#34D399;--ac2:#10B981;--ac-ink:#04130C;--glow:rgba(52,211,153,.35);--glow-soft:rgba(52,211,153,.12);
--grad:linear-gradient(135deg,#6EE7B7,#34D399 45%,#059669);--grad-soft:linear-gradient(135deg,rgba(52,211,153,.16),rgba(52,211,153,.03));--ac-line:rgba(52,211,153,.38);
--spring:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.56,.64,1)}
body[data-theme="cyan"]{--ac:#38BDF8;--ac2:#0EA5E9;--ac-ink:#041318;--glow:rgba(56,189,248,.35);--glow-soft:rgba(56,189,248,.12);--grad:linear-gradient(135deg,#7DD3FC,#38BDF8 45%,#0369A1);--grad-soft:linear-gradient(135deg,rgba(56,189,248,.16),rgba(56,189,248,.03));--ac-line:rgba(56,189,248,.38)}
body[data-theme="rose"]{--ac:#FB7185;--ac2:#F43F5E;--ac-ink:#1A060A;--glow:rgba(251,113,133,.35);--glow-soft:rgba(251,113,133,.12);--grad:linear-gradient(135deg,#FDA4AF,#FB7185 45%,#BE123C);--grad-soft:linear-gradient(135deg,rgba(251,113,133,.16),rgba(251,113,133,.03));--ac-line:rgba(251,113,133,.38)}
body[data-theme="amber"]{--ac:#FBBF24;--ac2:#F59E0B;--ac-ink:#171003;--glow:rgba(251,191,36,.33);--glow-soft:rgba(251,191,36,.12);--grad:linear-gradient(135deg,#FDE68A,#FBBF24 45%,#B45309);--grad-soft:linear-gradient(135deg,rgba(251,191,36,.16),rgba(251,191,36,.03));--ac-line:rgba(251,191,36,.38)}
body[data-theme="violet"]{--ac:#A78BFA;--ac2:#8B5CF6;--ac-ink:#120C22;--glow:rgba(167,139,250,.35);--glow-soft:rgba(167,139,250,.12);--grad:linear-gradient(135deg,#C4B5FD,#A78BFA 45%,#6D28D9);--grad-soft:linear-gradient(135deg,rgba(167,139,250,.16),rgba(167,139,250,.03));--ac-line:rgba(167,139,250,.38)}
body[data-theme="orange"]{--ac:#FB923C;--ac2:#F97316;--ac-ink:#1A0E05;--glow:rgba(251,146,60,.35);--glow-soft:rgba(251,146,60,.12);--grad:linear-gradient(135deg,#FDBA74,#FB923C 45%,#C2410C);--grad-soft:linear-gradient(135deg,rgba(251,146,60,.16),rgba(251,146,60,.03));--ac-line:rgba(251,146,60,.38)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;letter-spacing:-.012em;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--glow);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit;color:var(--ink)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.ic{flex-shrink:0;display:block}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(130px);opacity:.26;transition:transform 1.2s var(--spring)}
.orb.a{width:54vmax;height:54vmax;top:-18vmax;left:-14vmax;background:var(--ac2)}
.orb.b{width:44vmax;height:44vmax;bottom:-12vmax;right:-12vmax;background:#0E7490}
.orb.c{width:34vmax;height:34vmax;top:44%;left:36%;background:var(--ac2);opacity:.1}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E")}
#fx{position:fixed;inset:0;z-index:9000;pointer-events:none}
#fatal{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;background:#2B0B14;border:1px solid rgba(244,63,94,.6);color:#FECDD3;padding:12px 18px;border-radius:14px;font:700 12.5px var(--sans);max-width:min(92vw,640px);box-shadow:0 20px 50px rgba(0,0,0,.8)}
.loading{padding:60px 20px;text-align:center;color:var(--dim);font:600 14px var(--sans)}
/* rail */
.rail{display:none}
@media(min-width:1180px){
.rail{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:280px;z-index:90;background:rgba(8,11,19,.82);backdrop-filter:blur(30px);border-right:1px solid var(--b1);padding:24px 15px 18px;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}.app{margin-left:280px}.dock{display:none!important}}
.brand{display:flex;align-items:center;gap:13px;padding:2px 10px 18px;margin-bottom:8px;border-bottom:1px solid var(--b1)}
.brand-mark{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;flex-shrink:0;box-shadow:0 10px 26px var(--glow),var(--sheen)}
.brand-mark svg{color:var(--ac-ink)}
.brand h1{font-size:16px;font-weight:800;line-height:1.15}
.brand small{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.rsec{font-size:9.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:16px 12px 6px}
.rnav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:13px;border:1px solid transparent;background:transparent;color:var(--mut);font-size:13.5px;font-weight:700;text-align:left;transition:.22s var(--spring);position:relative}
.rnav:hover{color:#fff;background:rgba(255,255,255,.045)}
.rnav.on{color:var(--ac);background:var(--grad-soft);border-color:var(--ac-line)}
.rnav.on::before{content:"";position:absolute;left:-15px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.rnav .cnt{margin-left:auto;font:700 10.5px var(--mono);color:var(--ac);background:var(--grad-soft);border:1px solid var(--ac-line);border-radius:99px;padding:1px 8px}
.rail-foot{margin-top:auto;padding:14px 10px 2px;border-top:1px solid var(--b1)}
.rail-foot p{font-size:11px;line-height:1.6;color:var(--dim)}.rail-foot b{color:var(--mut)}
.kbd{font:600 10px var(--mono);border:1px solid var(--b2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--mut);background:rgba(255,255,255,.04)}
/* topbar */
.app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:14px;height:62px;padding:0 clamp(14px,3vw,30px);border-bottom:1px solid var(--b1);background:rgba(5,7,11,.72);backdrop-filter:blur(20px)}
.tb-brand{display:none;font:italic 400 21px var(--serif);color:var(--ink)}.tb-brand em{color:var(--ac)}
@media(max-width:1179px){.tb-brand{display:block}}
.tb-crumb{display:flex;align-items:center;gap:10px;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-width:0;overflow:hidden;white-space:nowrap}
.tb-crumb b{color:var(--ac)}.tb-crumb .sep{opacity:.4}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.searchpill{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--b1);background:rgba(255,255,255,.035);color:var(--dim);font:600 12.5px var(--sans);transition:.2s;box-shadow:var(--sheen)}
.searchpill:hover{border-color:var(--b2);color:var(--mut)}
@media(max-width:760px){.searchpill span:not(.kbd){display:none}}
@media(max-width:640px){.searchpill .kbd{display:none}.hm{display:none}}
/* stage */
.stage{width:100%;max-width:1160px;margin:0 auto;padding:26px clamp(14px,3vw,30px) 130px}
.title-block{margin-bottom:22px}
.kicker{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--b1);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
.beacon{width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac);animation:beacon 1.8s infinite}
@keyframes beacon{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.35}}
.title-block h1{font:italic 400 clamp(32px,4.6vw,46px)/1.08 var(--serif);color:#fff}
.title-block h1 em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.title-block .sub{margin-top:8px;font:500 14px var(--sans);color:var(--mut)}
/* primitives */
.panel{background:var(--glass);border:1px solid var(--b1);border-radius:22px;padding:clamp(16px,2.2vw,22px);backdrop-filter:blur(24px);box-shadow:var(--lift),var(--sheen);position:relative}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.lbl{font:700 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.lbl2{font:700 12px var(--sans);color:var(--mut)}
.panel-h .lbl{color:var(--mut);font-size:10px}
.hint{font:500 12px/1.6 var(--sans);color:var(--dim)}.hint b{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:41px;padding:0 16px;border-radius:13px;border:1px solid var(--b2);background:rgba(255,255,255,.05);color:var(--ink);font:700 13px var(--sans);transition:.22s var(--spring);white-space:nowrap;box-shadow:var(--sheen)}
.btn:hover{background:rgba(255,255,255,.1);border-color:var(--b3);transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.acc{background:var(--grad);border-color:transparent;color:var(--ac-ink);box-shadow:0 10px 28px var(--glow)}
.btn.sm{height:32px;padding:0 12px;font-size:11.5px;border-radius:10px}
.btn.danger{color:#FB7185;border-color:rgba(251,113,133,.35)}
.ibtn{width:40px;padding:0;justify-content:center}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--b1);background:rgba(255,255,255,.03);color:var(--mut);font:700 12.5px var(--sans);transition:.2s var(--spring)}
.chip:hover{color:var(--ink);border-color:var(--b2)}
.chip.on{background:var(--grad-soft);border-color:var(--ac-line);color:var(--ac)}
.chips-row{display:flex;gap:8px;flex-wrap:wrap}
.insight{display:flex;align-items:flex-start;gap:9px;margin-top:15px;padding:11px 14px;border-radius:14px;border:1px solid var(--ac-line);background:var(--grad-soft);font:600 12.5px/1.55 var(--sans)}
.insight .ic{color:var(--ac);margin-top:1px}
.ins-row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--b1);font:600 13px/1.6 var(--sans);color:var(--mut)}
.ins-row:last-child{border-bottom:none}.ins-row .ic{color:var(--ac);margin-top:2px}
/* members */
.mstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;margin-bottom:20px}
.mchip{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;border-radius:18px;border:1px solid var(--b1);background:rgba(255,255,255,.02);text-align:left;transition:.22s var(--spring);box-shadow:var(--sheen)}
.mchip:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--mc) 35%,transparent)}
.mchip.on{border-color:color-mix(in srgb,var(--mc) 50%,transparent);background:color-mix(in srgb,var(--mc) 7%,transparent)}
.mava{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:400 20px var(--serif);color:var(--mc);border:1px solid color-mix(in srgb,var(--mc) 40%,transparent);background:color-mix(in srgb,var(--mc) 10%,transparent);flex-shrink:0}
.mava.sm{width:32px;height:32px;border-radius:10px;font-size:16px}
.mchip .mtx{flex:1;min-width:0}
.mchip .mtx b{display:block;font:800 14px var(--sans);color:var(--ink)}
.mchip .mtx small{display:block;font:600 10.5px var(--sans);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniring{flex-shrink:0}.miniring text{font:700 10px var(--mono);fill:var(--ink)}
.badge-ath{font:700 8.5px var(--mono);letter-spacing:.08em;color:var(--ac);border:1px solid var(--ac-line);border-radius:5px;padding:1px 6px}
/* hero */
.hero{position:relative;overflow:hidden;margin-bottom:18px}
.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(540px 400px at 15% 30%,var(--glow-soft),transparent 70%)}
.hero-grid{position:relative;display:grid;grid-template-columns:auto 1fr 230px;gap:clamp(18px,3vw,34px);align-items:center;z-index:1}
.gauge-wrap{position:relative;width:252px;height:252px}
.gauge-wrap svg{width:100%;height:100%;display:block}
.gval{transition:stroke-dashoffset 1.1s var(--spring);filter:drop-shadow(0 0 10px var(--glow))}
.gauge-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-bottom:18px}
.gauge-mid b{font:700 56px/1 var(--mono);letter-spacing:-.04em}
.gauge-delta{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:inline-flex;gap:5px;font:700 11px var(--mono);color:var(--mut);border:1px solid var(--b1);border-radius:99px;padding:3px 10px;background:rgba(0,0,0,.3);white-space:nowrap}
.gauge-delta b{color:var(--ac)}
.kcal-line{display:flex;align-items:baseline;gap:8px;margin:5px 0 7px}
.kcal-line b{font:700 28px/1 var(--mono)}
.kcal-line span{font:600 13px var(--mono);color:var(--dim)}
.kbar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:16px}
.kbar i{display:block;height:100%;border-radius:99px;background:var(--grad);box-shadow:0 0 10px var(--glow);transition:width .9s var(--spring)}
.brow{margin-bottom:13px}
.brow-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.brow-top .mono{font:600 12.5px var(--mono);color:var(--mut)}.brow-top .mono b{color:var(--ink)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .9s var(--spring)}
.hero-water{border-left:1px solid var(--b1);padding-left:clamp(16px,2vw,26px)}
.water-big{font:700 27px/1 var(--mono);margin:6px 0 2px;color:var(--water);text-shadow:0 0 18px rgba(56,189,248,.35)}
.cups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:13px 0 11px}
.cup{position:relative;overflow:hidden;height:50px;border-radius:12px;border:1px solid var(--b1);background:rgba(255,255,255,.025);transition:.2s;box-shadow:var(--sheen)}
.cup:hover{border-color:rgba(56,189,248,.45);transform:translateY(-2px)}
.cup i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#7DD3FC,#0EA5E9);transition:height .5s var(--spring)}
.cup.full{border-color:rgba(56,189,248,.35)}
.water-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.water-foot .hint{font-size:11px}
.wbtns{display:flex;gap:6px}
.wbtns button{width:30px;height:30px;border-radius:9px;border:1px solid var(--b2);background:rgba(255,255,255,.04);color:var(--mut);display:grid;place-items:center;transition:.18s}
.wbtns button:hover{color:var(--water);border-color:rgba(56,189,248,.45)}
/* ===== ΝΕΟ: Οθόνη βάρους enterprise ===== */
.weight-hero{position:relative;overflow:hidden}
.weight-hero::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)}
.weight-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px 400px at 20% 40%,var(--glow-soft),transparent 70%)}
.weight-grid{position:relative;display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,32px);align-items:center;z-index:1}
@media(max-width:900px){.weight-grid{grid-template-columns:1fr;text-align:center}.scale-gauge{margin:0 auto}}
.scale-gauge{position:relative;width:280px;height:280px;flex-shrink:0}
.scale-gauge svg{width:100%;height:100%;display:block}
.scale-needle{transition:transform 1s var(--spring);transform-origin:140px 140px;filter:drop-shadow(0 0 8px var(--glow))}
.scale-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-bottom:8px}
.scale-mid b{font:700 52px/1 var(--mono);letter-spacing:-.04em;text-shadow:0 0 30px var(--glow)}
.scale-mid .unit{font:700 11px var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.scale-badge{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:5px;font:700 10px var(--mono);letter-spacing:.08em;color:var(--ac);border:1px solid var(--ac-line);background:var(--grad-soft);border-radius:99px;padding:3px 11px;white-space:nowrap}
.wstat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:15px 0}
.wstat{border:1px solid var(--b1);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.015)}
.wstat span{font:700 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block}
.wstat b{font:700 22px/1.2 var(--mono);display:block;margin-top:5px;letter-spacing:-.02em}
.wstat b small{font-size:11px;color:var(--dim);font-weight:600}
.wstat b.up{color:#FB7185}.wstat b.down{color:var(--ac)}
.bmi-bar{height:10px;border-radius:99px;overflow:hidden;display:flex;margin-top:7px}
.bmi-bar i{display:block;height:100%}

.ov{position:fixed;inset:0;z-index:2000;display:none;place-items:center;padding:18px;background:rgba(2,4,8,.8);backdrop-filter:blur(16px);overflow-y:auto}
.ov.open{display:grid}
.ov.top{place-items:start center;padding-top:11vh}
.modal{width:100%;max-width:740px;max-height:86vh;overflow-y:auto;background:#0B101B;border:1px solid var(--b2);border-radius:26px;padding:22px;animation:pop .32s var(--spring);box-shadow:0 40px 100px rgba(0,0,0,.9)}
@keyframes pop{from{transform:scale(.95) translateY(24px);opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.mh h3{font:italic 400 25px var(--serif);color:var(--ink)}
.mh p{font:500 12.5px var(--sans);color:var(--mut);margin-top:3px}
.xbtn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.07);color:var(--ink);display:grid;place-items:center;transition:.2s;flex-shrink:0}
.xbtn:hover{background:rgba(255,255,255,.16)}
.sm-prog{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sm-prog b{font:700 13px var(--mono);color:var(--ac)}
.sm-prog .bar i{background:var(--grad)}
.sm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.aisle-h{display:flex;align-items:center;gap:9px;font:700 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin:18px 0 9px}
.aisle-h span{color:var(--dim)}
.sitem{display:flex;align-items:center;gap:12px;border:1px solid var(--b1);border-radius:13px;padding:10px 13px;margin-bottom:7px;background:rgba(255,255,255,.015)}
.sitem:hover{border-color:var(--b2)}
.smcheck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--b2);background:transparent;color:transparent;display:grid;place-items:center;flex-shrink:0;transition:.2s var(--bounce)}
.smcheck:hover{border-color:var(--ac);color:var(--ac)}
.sitem.hit .smcheck{background:var(--grad);border-color:transparent;color:var(--ac-ink);box-shadow:0 4px 14px var(--glow)}
.sitem .sn{flex:1;min-width:0;font:700 13px var(--sans)}
.sitem.hit .sn{text-decoration:line-through;opacity:.45}
.sitem .sq{font:700 12px var(--mono);color:var(--mut);white-space:nowrap}
.sitem .srm{width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:var(--dim);display:grid;place-items:center;transition:.18s}
.sitem .srm:hover{color:#FB7185;background:rgba(251,113,133,.1)}
.addrow{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-bottom:6px}
@media(max-width:640px){.addrow{grid-template-columns:1fr auto}}
.picker-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:14px;border:1px solid var(--b1);background:rgba(255,255,255,.015);margin-bottom:7px;text-align:left;transition:.18s}
.picker-item:hover{border-color:var(--ac-line);background:var(--grad-soft)}
.picker-item b{display:block;font:400 16px var(--serif);color:var(--ink)}
.picker-item small{font:600 11px var(--mono);color:var(--dim)}
.picker-item .pic-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.palette{width:min(640px,94vw);background:#0B101B;border:1px solid var(--b2);border-radius:22px;overflow:hidden;animation:pop .25s var(--spring);box-shadow:0 40px 90px rgba(0,0,0,.75)}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--b1)}
.pal-in .ic{color:var(--ac)}
.pal-in input{flex:1;height:56px;background:transparent;border:none;outline:none;font:600 15px var(--sans);color:var(--ink)}
.pal-in input::placeholder{color:var(--dim)}
.pal-list{max-height:52vh;overflow-y:auto;padding:8px}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:none;background:transparent;color:var(--ink);font:700 13.5px var(--sans);text-align:left}
.pal-item .ic{color:var(--dim)}
.pal-item .pg{margin-left:auto;font:600 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.pal-item.sel{background:var(--grad-soft)}
.pal-item.sel .ic{color:var(--ac)}
.pal-foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--b1);font:600 10.5px var(--mono);color:var(--dim)}
.tour-ic{width:64px;height:64px;border-radius:20px;border:1px solid var(--ac-line);background:var(--grad-soft);color:var(--ac);display:grid;place-items:center;margin:6px auto 18px;box-shadow:0 10px 30px var(--glow-soft)}
.tour-dots{display:flex;gap:7px;justify-content:center;margin:18px 0}
.tour-dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.15);transition:.25s}
.tour-dots i.on{background:var(--ac);width:22px}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:12px;border:2px solid transparent;transition:.2s var(--bounce)}
.swatch:hover{transform:scale(1.1)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.medit-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.medit-grid .full{grid-column:span 2}
@media(max-width:560px){.medit-grid{grid-template-columns:1fr}.medit-grid .full{grid-column:span 1}}
.mprev{border:1px solid var(--ac-line);background:var(--grad-soft);border-radius:15px;padding:13px 15px;margin-top:14px;display:flex;gap:18px;flex-wrap:wrap}
.mprev div b{display:block;font:700 19px var(--mono);color:var(--ac)}
.mprev div span{font:700 8.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--b1)}
.set-row:last-child{border-bottom:none}
.set-row b{display:block;font:800 13.5px var(--sans)}
.set-row small{font:500 11.5px var(--sans);color:var(--dim)}
/* toast / dock */
.toast{position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-24px);z-index:6000;display:flex;align-items:center;gap:9px;background:#101724;border:1px solid var(--b2);border-radius:99px;padding:11px 20px;font:700 13px var(--sans);color:var(--ink);opacity:0;pointer-events:none;transition:.35s var(--bounce);box-shadow:0 20px 50px rgba(0,0,0,.75);max-width:min(92vw,480px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ic{color:var(--ac)}
.dock{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:900;display:flex;gap:2px;padding:7px 9px;border-radius:21px;background:rgba(9,12,19,.9);border:1px solid var(--b2);backdrop-filter:blur(28px);box-shadow:0 22px 54px rgba(0,0,0,.85);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock button{position:relative;background:transparent;border:none;border-radius:14px;color:var(--mut);font:800 9px var(--sans);padding:7px 8px;min-width:50px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s;flex-shrink:0}
.dock button.on{background:var(--grad-soft);color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac-line)}
.dock .dbadge{position:absolute;top:2px;right:2px;font:700 9px var(--mono);color:var(--ac-ink);background:var(--ac);border-radius:99px;padding:1px 5px;min-width:15px}
.rise{animation:rise .5s var(--spring) both;animation-delay:calc(var(--i,0)*70ms)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{
body{background:#fff!important;color:#000!important}
.rail,.topbar,.dock,.ambient,.grain,#fx,.toast,.quickbar,.mstrip,.planner-bar,.sm-actions,.xbtn,.addrow,.rec-acts,.tl-acts,.smcheck,.srm,.sadj,.an-controls,.weight-input-row,.w-hist-row .wrm{display:none!important}
.stage{max-width:100%;padding:0}
.panel,.day,.rec{background:#fff!important;border:1px solid #ccc!important;backdrop-filter:none!important;box-shadow:none!important}
h1,h2,h3,h4,b,span,div,p,small,td,th,li,label{color:#111!important}
.lbl,.hint{color:#555!important}
.ov{position:static;display:block!important;background:none;padding:0}
.ov .modal{max-width:100%;max-height:none;overflow:visible;background:#fff;border:none;box-shadow:none;padding:0}}
</style>
</head>

var KEY='ZENITH_PRO_V13';
var BAK_KEY='ZENITH_PRO_BAK';
function isPlain(o){return !!o&&typeof o==='object'&&!Array.isArray(o);}
function deepMerge(base,over){
  var out={},k;
  for(k in base){if(Object.prototype.hasOwnProperty.call(base,k))out[k]=base[k];}
  if(!over||typeof over!=='object')return out;
  for(k in over){
    if(!Object.prototype.hasOwnProperty.call(over,k))continue;
    if(isPlain(out[k])&&isPlain(over[k]))out[k]=deepMerge(out[k],over[k]);
    else out[k]=over[k];
  }
  return out;
}
function writeBackup(){
  try{
    var b=localStorage.getItem(BAK_KEY);
    var keep=[];
    if(b){try{keep=JSON.parse(b);}catch(e){keep=[];}if(!Array.isArray(keep))keep=[];}
    keep.push({t:Date.now(),d:S});
    while(keep.length>3)keep.shift();
    localStorage.setItem(BAK_KEY,JSON.stringify(keep));
  }catch(e){}
}
function readState(){
  var d=defaultState();
  var LEGACY='ZENITH_PRO_V12';
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw){raw=localStorage.getItem(LEGACY);if(raw){localStorage.removeItem(LEGACY);}}
    if(raw){
      var p=JSON.parse(raw),s=deepMerge(d,p);
      if(!s.members||!s.members.length)s.members=defaultMembers();
      if(!s.plan||!s.plan['Δευτέρα'])s.plan=defaultState().plan;
      var ok=false,i;
      for(i=0;i<s.members.length;i++){ if(s.members[i].id===s.member)ok=true; }
      if(!ok)s.member=s.members[0].id;
      return s;
    }
  }catch(e){}
  /* Recovery: main key corrupted — try the auto-backup ring */
  try{
    var b=localStorage.getItem(BAK_KEY);
    if(b){
      var ring=JSON.parse(b),last=ring&&ring.length?ring[ring.length-1].d:null;
      if(last&&last.members&&last.members.length){
        var s2=deepMerge(d,last);
        if(!s2.members||!s2.members.length)s2.members=defaultMembers();
        return s2;
      }
    }
  }catch(e2){}
  return d;
}

    while(keys.length>90){delete S.logs[keys[0]];keys.shift();}

      var ks=Object.keys(S.logs).sort();
      while(ks.length>45){delete S.logs[ks[0]];ks.shift();}

    }catch(e2){}
  }
}

function member(){
  for(var i=0;i<S.members.length;i++){ if(S.members[i].id===S.member)return S.members[i]; }
  return S.members[0];
}
function dkey(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayKey(){return dkey(new Date());}
function todayDay(){return DAYS[(new Date().getDay()+6)%7];}
function dayNameOf(dk){var p=dk.split('-');return GREEK_DOW[new Date(+p[0],+p[1]-1,+p[2]).getDay()];}
function peek(mid,dk){return (S.logs[dk]||{})[mid];}
function logOf(mid,dk){
  mid=mid||S.member;dk=dk||todayKey();
  if(!S.logs[dk])S.logs[dk]={};
  if(!S.logs[dk][mid])S.logs[dk][mid]={meals:{},water:0,bio:null,sleep:null,ex:{}};
  return S.logs[dk][mid];
}
function targets(mid){
  var p=null,i;
  for(i=0;i<S.members.length;i++){ if(S.members[i].id===mid)p=S.members[i]; }
  if(!p)p=S.members[0];
  var bmr=Math.round(10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161));
  var tdee=Math.round(bmr*p.act);
  var kcal=Math.round(tdee*p.goal/10)*10;
  var prot=Math.round((p.athlete?2.0:1.8)*p.weight);
  var fat=Math.round(0.9*p.weight);
  var carb=Math.max(60,Math.round((kcal-prot*4-fat*9)/4));
  return{bmr:bmr,tdee:tdee,kcal:kcal,prot:prot,carb:carb,fat:fat};
}
function waterTarget(mid){
  var p=null,i;
  for(i=0;i<S.members.length;i++){ if(S.members[i].id===mid)p=S.members[i]; }
  if(!p)p=S.members[0];
  return Math.max(6,Math.min(12,Math.round(p.weight*(p.athlete?38:33)/250)));
}
function bmiOf(mid){
  var p=null,i;
  for(i=0;i<S.members.length;i++){ if(S.members[i].id===mid)p=S.members[i]; }
  if(!p)p=S.members[0];
  var h=p.height/100;
  return Math.round(p.weight/(h*h)*10)/10;
}
function bmiLabel(v){
  if(v<18.5)return 'Υποβάρο';
  if(v<25)return 'Φυσιολογικό';
  if(v<30)return 'Υπέρβαρο';
  return 'Παχυσαρκία';
}
function bmiColor(v){
  if(v<18.5)return '#38BDF8';
  if(v<25)return '#34D399';
  if(v<30)return '#FBBF24';
  return '#FB7185';
}
function consumedOn(mid,dk){
  var lg=peek(mid,dk);
  if(!lg||!lg.meals||!Object.keys(lg.meals).length)return null;
  var m=null,i;
  for(i=0;i<S.members.length;i++){ if(S.members[i].id===mid)m=S.members[i]; }
  var mult=(m&&m.mult)||1;
  var day=dayNameOf(dk);
  var p=0,c=0,f=0,k=0;
  for(i=0;i<SLOTS.length;i++){
    if(lg.meals[SLOTS[i].id]){
      var r=rec((S.plan[day]||{})[SLOTS[i].id]);
      if(r){var mc=macrosOf(r);p+=mc.p*mult;c+=mc.c*mult;f+=mc.f*mult;k+=mc.k*mult;}
    }
  }
  return{p:Math.round(p),c:Math.round(c),f:Math.round(f),k:Math.round(k)};
}
function consumed(mid){var r=consumedOn(mid||S.member,todayKey());return r||{p:0,c:0,f:0,k:0};}
function scoreOf(mid,dk){
  var lg=peek(mid,dk||todayKey());
  if(!lg)return null;
  var meals=0,i;
  for(i=0;i<SLOTS.length;i++){ if(lg.meals&&lg.meals[SLOTS[i].id])meals++; }
  var wt=waterTarget(mid);
  var water=Math.min((lg.water||0)/wt,1);
  var bio=lg.bio?1:0;
  return{score:Math.round(55*(meals/4)+30*water+15*bio),meals:meals,water:lg.water||0,wt:wt};
}
function allMealsDone(lg){
  if(!lg||!lg.meals)return false;
  for(var i=0;i<SLOTS.length;i++){ if(!lg.meals[SLOTS[i].id])return false; }
  return true;
}
function streakOf(mid){
  var n=0,first=true,d=new Date();
  for(var i=0;i<3650;i++){
    if(allMealsDone(peek(mid,dkey(d)))){n++;}
    else if(!first)break;
    first=false;d.setDate(d.getDate()-1);
  }
  return n;
}

function frHalf(v){
  var r=Math.round(v*2)/2;
  if(r%1)return String(r).replace('.',',');

}
function fq(v){
  if(v>=100)return Math.round(v/5)*5;

  return Math.round(v*10)/10;
}
function fmtQty(fd,g){
  if(fd.unit)return frHalf(g/fd.unit.g)+' '+fd.unit.n;

function nf(v){return String(v).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function hoursUntil(t){

function fmtIn(h){

function insight(){
  var lg=logOf(),t=targets(S.member),cs=consumed(),wt=waterTarget(S.member);
  var h=new Date().getHours()+new Date().getMinutes()/60;
  var done=0,i;
  for(i=0;i<SLOTS.length;i++){ if(lg.meals[SLOTS[i].id])done++; }
  if(done===4&&lg.water>=wt)return 'Τέλεια μέρα! Μια βόλτα 10 λεπτών μετά το δείπνο κλείνει τον κύκλο με το καλύτερο.';
  if(done===4&&cs.k<t.kcal*0.85)return 'Τα γεύματα έκλεισαν — συμπλήρωσε με φρούτο ή ξηρούς καρπούς (+'+Math.round(t.kcal-cs.k)+' kcal).';
  if(lg.bio==='tired')return 'Σημειώθηκε κούραση: βάλε σύνθετους υδατάνθρακες στο επόμενο γεύμα.';
  if(lg.water<wt&&h>=16)return 'Ενυδάτωση: λείπουν '+(wt-lg.water)+' ποτήρια. Γέμισε το μπουκάλι σου τώρα.';
  if(lg.sleep!=null&&lg.sleep<7&&h>=20)return 'Χθες '+frHalf(lg.sleep)+'h ύπνος — απόψε στόχευσε 30 λεπτά νωρίτερα στο κρεβάτι.';
  for(i=0;i<SLOTS.length;i++){
    if(!lg.meals[SLOTS[i].id]){

      return 'Επόμενο: '+SLOTS[i].label.toLowerCase()+' — '+(r?r.n:'όρισε γεύμα στο πλάνο')+'.';
    }
  }
  return 'Ξεκίνα με το πρωινό — η ενέργεια όλης της ημέρας ακολουθεί.';
}

    if(this.ctx.state==='suspended')this.ctx.resume();
    var o=this.ctx.createOscillator(),g=this.ctx.createGain();

    g.gain.setValueAtTime(vol||.05,this.ctx.currentTime);

    o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+(dur||.08));
  }catch(e){}
},

  try{
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var cols=[base,'#FFFFFF','#FBBF24','#38BDF8'];
    for(var i=0;i<28;i++){
      var a=Math.random()*Math.PI*2,sp=2+Math.random()*5;
      FXC.parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3.2,life:1,r:1.5+Math.random()*2,c:cols[i%4],spark:Math.random()<.32});
    }
    if(!FXC.raf){FXC.raf=true;requestAnimationFrame(stepFx);}
  }catch(e){}
}
function stepFx(){
  var c=$('fx'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  FXC.parts=FXC.parts.filter(function(p){return p.life>0;});
  FXC.parts.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.985;p.life-=.016;
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.strokeStyle=p.c;
    if(p.spark){ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2);ctx.stroke();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  });
  ctx.globalAlpha=1;
  if(FXC.parts.length)requestAnimationFrame(stepFx);
  else{FXC.raf=false;ctx.clearRect(0,0,c.width,c.height);}
}
function burstAtEl(el,color){
  if(!el)return;
  var r=el.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,color||member().color);
}
function countUp(el,to){
  if(!el)return;
  var from=parseInt(el.textContent,10)||0;
  if(from===to){el.textContent=to;return;}
  var t0=performance.now(),dur=650;
  function step(t){
    var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(to-from)*e);
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

setTimeout(function(){
  try{
    var v=$('view');
    if(v&&v.getAttribute('data-ready')!=='1'){

      '<p><b>Η εκκίνηση δεν ολοκληρώθηκε.</b><br>Δοκίμασε Chrome/Edge/Safari με άνοιγμα του .html αρχείου.</p></div>';
    }
  }catch(e){}
},1800);
</script>

function gaugeHTML(score){
  var R=92,cx=126,cy=126;
  function pol(r,deg){var a=deg*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  var p0=pol(R,135),p1=pol(R,405);
  var arc='M '+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A '+R+' '+R+' 0 1 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1);
  var ticks='';
  for(var i=0;i<=27;i++){
    var deg=135+i*10,major=(i%3===0);
    var t1=pol(R+12,deg),t2=pol(R+(major?21:16),deg);
    ticks+='<line x1="'+t1[0].toFixed(1)+'" y1="'+t1[1].toFixed(1)+'" x2="'+t2[0].toFixed(1)+'" y2="'+t2[1].toFixed(1)+'" stroke="'+(major?'rgba(255,255,255,.3)':'rgba(255,255,255,.1)')+'" stroke-width="'+(major?1.6:1)+'"/>';
  }
  var arcLen=2*Math.PI*R*0.75;
  var off=arcLen*(1-Math.max(0,Math.min(1,score/100)));

  var y=ys?ys.score:0,delta=score-y;

  h+='<defs><linearGradient id="ggrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ac)"/><stop offset="1" style="stop-color:var(--ac2)"/></linearGradient></defs>';
  h+=ticks;
  h+='<path d="'+arc+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="10" stroke-linecap="round"/>';
  h+='<path id="gaugeVal" class="gval" d="'+arc+'" fill="none" stroke="url(#ggrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+arcLen.toFixed(1)+'" stroke-dashoffset="'+(animateNext?arcLen.toFixed(1):off.toFixed(1))+'" data-off="'+off.toFixed(1)+'"/>';
  h+='</svg><div class="gauge-mid"><b id="scoreNum" class="mono" data-to="'+score+'">'+(animateNext?0:score)+'</b><span class="lbl">Score ημέρας</span></div>';

function libRows(){
  var q=S.libQ.trim().toLowerCase();
  var list=[],i,j;
  for(i=0;i<RECIPES.length;i++){
    var r=RECIPES[i];
    if(S.libCat==='fav'&&S.favs.indexOf(r.id)<0)continue;
    if(S.libCat!=='all'&&S.libCat!=='fav'&&r.cat!==S.libCat)continue;
    if(q){
      var hit=r.n.toLowerCase().indexOf(q)>=0||r.tag.toLowerCase().indexOf(q)>=0;
      if(!hit){
        for(j=0;j<r.ing.length;j++){ if(FOODS[r.ing[j][0]].n.toLowerCase().indexOf(q)>=0){hit=true;break;} }
      }
      if(!hit)continue;
    }
    list.push(r);
  }
  var cnt=$('libCount');if(cnt)cnt.textContent=list.length+' συνταγές';
  if(!list.length)return '<div class="empty">'+ic('search',30)+'<p>Καμία συνταγή'+(S.libCat==='fav'?' στις αγαπημένες':'')+'.<br>Δοκίμασε άλλη λέξη ή κατηγορία.</p></div>';
  var h='';
  for(i=0;i<list.length;i++)h+=recRow(list[i]);
  return h;
}

function plateGuide(){
  var cx=75,cy=75,r=58;
  function P(a){return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  function arc(a0,a1,fill){
    var s=P(a0),e=P(a1),large=(a1-a0)>Math.PI?1:0;
    return '<path d="M'+cx+' '+cy+' L'+s[0].toFixed(1)+' '+s[1].toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+e[0].toFixed(1)+' '+e[1].toFixed(1)+' Z" fill="'+fill+'"/>';
  }
  var g=.05;
  var h='<svg viewBox="0 0 150 150" style="width:132px;height:132px;display:block;margin:0 auto">';
  h+='<circle cx="75" cy="75" r="66" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.14)"/>';
  h+=arc(-Math.PI/2+g,Math.PI/2-g,'#4CAF7D')+arc(Math.PI/2+g,Math.PI-g,'#E1677C')+arc(Math.PI+g,3*Math.PI/2-g,'#E5B04C');
  h+='<text x="108" y="80" text-anchor="middle" font-size="16" font-weight="800" fill="#05070B" font-family="Plus Jakarta Sans">½</text>';
  h+='<text x="75" y="122" text-anchor="middle" font-size="13" font-weight="800" fill="#05070B" font-family="Plus Jakarta Sans">¼</text>';
  h+='<text x="42" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#05070B" font-family="Plus Jakarta Sans">¼</text></svg>';
  h+='<div class="plate-legend">';
  h+='<div class="pl-row"><i style="background:#4CAF7D"></i><span><b>Λαχανικά & χόρτα</b> — ½ του πιάτου (2 γροθιές)</span></div>';
  h+='<div class="pl-row"><i style="background:#E1677C"></i><span><b>Πρωτεΐνη</b> — ¼ (1 παλάμι)</span></div>';
  h+='<div class="pl-row"><i style="background:#E5B04C"></i><span><b>Υδατάνθρακες</b> — ¼ (1 κούπα χεριού)</span></div>';
  h+='<div class="pl-row"><i style="background:#F5D76E"></i><span><b>Ελαιόλαδο</b> — 1 αντίχειρα (μαγείρεμα & σαλάτα)</span></div></div>';
  h+='<p class="hint" style="margin-top:10px">Ο πιο απλός κανόνας ισορροπημένου γεύματος — χωρίς ζυγαριά και υπολογισμούς.</p>';
  return h;
}
function protSources(){
  var list=[],k;
  for(k in FOODS){
    var f=FOODS[k];
    if(f.p>5&&fKcal(f)<400)list.push({n:f.n,p:f.p,k:Math.round(fKcal(f))});
  }
  list.sort(function(a,b){return(b.p/a.k)-(a.p/b.k);});
  var h='';
  for(var i=0;i<list.length&&i<6;i++){
    h+='<div class="prot-row"><b>'+list[i].n+'</b><span class="mono">'+list[i].p+'g P / '+list[i].k+' kcal</span></div>';
  }
  return h+'<p class="hint" style="margin-top:10px">Κατάταξη βάσει πρωτεΐνης ανά θερμίδα — από τη βάση τροφίμων της εφαρμογής.</p>';
}

var Timer={
  total:60,left:60,running:false,endAt:0,iv:null,
  preset:function(s){this.stop();this.total=s;this.left=s;this.paint();FX.tap();},
  adj:function(d){this.stop();this.total=Math.max(5,this.total+d);this.left=Math.min(this.left,this.total);if(this.left<=0)this.left=this.total;this.paint();FX.tap();},
  toggle:function(){ if(this.running)this.stop(true); else this.start(); },
  start:function(){
    if(this.left<=0)this.left=this.total;
    this.running=true;this.endAt=Date.now()+this.left*1000;
    var self=this;this.iv=setInterval(function(){self.tick();},120);
    FX.tap();
    var b=$('tToggle');if(b)b.innerHTML=ic('pause',16)+'Παύση';
  },
  stop:function(keep){
    this.running=false;clearInterval(this.iv);this.iv=null;
    if(keep){var b=$('tToggle');if(b)b.innerHTML=ic('play',16)+'Έναρξη';}
  },
  tick:function(){
    this.left=Math.max(0,(this.endAt-Date.now())/1000);
    this.paint();
    if(this.left<=0){
      this.stop();FX.beep();vibrate([100,60,100]);
      var card=$('timerCard');
      if(card){card.classList.add('tflash');setTimeout(function(){card.classList.remove('tflash');},2200);}
      toast('Τέλος ανάπαυσης — επόμενη σειρά!','timer');
    }
  },
  reset:function(){this.stop();this.left=this.total;this.paint();FX.tap();var b=$('tToggle');if(b)b.innerHTML=ic('play',16)+'Έναρξη';},
  paint:function(){
    var d=$('tDisp');if(!d)return;
    var hh=pad2(Math.floor(this.left/60)),ss=pad2(Math.floor(this.left%60));
    d.textContent=hh+':'+ss;
    var r=$('tRing');
    if(r){var C=2*Math.PI*64;r.style.strokeDashoffset=C*(1-this.left/this.total);}
  }
};

function autofill(){
  var pools={breakfast:[],snack:[],lunch:[],dinner:[]};
  for(var i=0;i<RECIPES.length;i++){
    var r=RECIPES[i];
    if(r.kind==='breakfast')pools.breakfast.push(r);
    else if(r.kind==='snack')pools.snack.push(r);
    else if(r.kind==='main')pools.lunch.push(r);
    else pools.dinner.push(r);
  }
  for(var d=0;d<DAYS.length;d++){
    if(!S.plan[DAYS[d]])S.plan[DAYS[d]]={};
    for(var s=0;s<SLOTS.length;s++){
      var sid=SLOTS[s].id;
      if(!S.plan[DAYS[d]][sid]){
        var pool=pools[sid];
        S.plan[DAYS[d]][sid]=pool[(d+s*2)%pool.length].id;
      }
    }
  }
  save();renderAll();FX.check();evalAch();
  toast('Τα κενά της εβδομάδας συμπληρώθηκαν με ισορροπημένες επιλογές','spark');
}
var clearArmed=false;
function clearWeek(btn){
  if(clearArmed){
    for(var d=0;d<DAYS.length;d++){
      if(!S.plan[DAYS[d]])S.plan[DAYS[d]]={};
      for(var s=0;s<SLOTS.length;s++)S.plan[DAYS[d]][SLOTS[s].id]=null;
    }
    clearArmed=false;save();renderAll();
    toast('Το πλάνο καθάρισε','refresh');
  }else{
    clearArmed=true;
    btn.innerHTML=ic('info',15)+'Πάτα ξανά για επιβεβαίωση';
    setTimeout(function(){
      clearArmed=false;
      var b=$('clearWeekBtn');
      if(b)b.innerHTML=ic('trash',15)+'Καθαρισμός';
    },2600);
  }
}

function chartEmpty(){return '<div class="empty" style="padding:22px 10px">'+ic('chart',26)+'<p>Χρειάζονται μερικές μέρες καταγραφών<br>για να σχεδιαστούν τα γραφήματα.</p></div>';}
function lineChart(items,opts){
  opts=opts||{};
  var W=600,H=150,pt=12,pb=20;
  var vals=[];
  for(var i=0;i<items.length;i++){ if(items[i].v!=null)vals.push(items[i].v); }
  if(!vals.length)return chartEmpty();
  var max=(opts.max!=null)?opts.max:Math.max.apply(null,vals.concat([1]));
  var min=(opts.min!=null)?opts.min:Math.min.apply(null,vals.concat([0]));
  var rng=(max-min)||1;
  function X(i){return items.length===1?W/2:(i/(items.length-1))*(W-14)+7;}
  function Y(v){return pt+(1-(v-min)/rng)*(H-pt-pb);}
  var segs=[],cur=[];
  for(i=0;i<items.length;i++){
    if(items[i].v==null){ if(cur.length)segs.push(cur); cur=[]; }
    else cur.push([i,items[i]]);
  }
  if(cur.length)segs.push(cur);
  var paths='',area='',dots='';
  for(var s=0;s<segs.length;s++){
    var seg=segs[s];
    var d='';
    for(var q=0;q<seg.length;q++){
      d+=(q?'L':'M')+X(seg[q][0]).toFixed(1)+' '+Y(seg[q][1].v).toFixed(1)+' ';
    }
    paths+='<path d="'+d+'" style="stroke:var(--ac)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    if(seg.length>1){
      var a='M'+X(seg[0][0]).toFixed(1)+' '+(H-pb)+' ';
      for(q=0;q<seg.length;q++)a+='L'+X(seg[q][0]).toFixed(1)+' '+Y(seg[q][1].v).toFixed(1)+' ';
      a+='L'+X(seg[seg.length-1][0]).toFixed(1)+' '+(H-pb)+' Z';
      area+='<path d="'+a+'" style="fill:var(--ac)" opacity=".08"/>';
    }
    for(q=0;q<seg.length;q++)dots+='<circle cx="'+X(seg[q][0]).toFixed(1)+'" cy="'+Y(seg[q][1].v).toFixed(1)+'" r="2.6" style="fill:var(--ac)"/>';
  }
  var step=Math.ceil(items.length/8);
  var lbls='';
  for(i=0;i<items.length;i++){
    if(i%step===0)lbls+='<text x="'+X(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9" fill="#5D6B85" font-family="JetBrains Mono">'+items[i].l+'</text>';
  }
  var grid='<line x1="0" x2="'+W+'" y1="'+(pt+.5*(H-pt-pb))+'" y2="'+(pt+.5*(H-pt-pb))+'" stroke="rgba(128,140,160,.12)"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'">'+grid+area+paths+dots+lbls+'</svg>';
}
function barChart(items,opts){
  opts=opts||{};
  var W=600,H=150,pt=10,pb=20;
  var all=[];
  for(var i=0;i<items.length;i++)all.push(items[i].v);
  all.push(opts.target||0,1);
  var max=opts.max||Math.max.apply(null,all);
  var n=items.length,bw=Math.min(34,(W/n)*.55);
  var bars='',lbls='';
  for(i=0;i<items.length;i++){
    var x=W/n*(i+.5);
    var hgt=items[i].v>0?Math.max(3,(items[i].v/max)*(H-pt-pb)):0;
    var y=H-pb-hgt;
    if(items[i].v>0)bars+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" rx="3.5" style="fill:var(--ac)" opacity=".9"/>';
    else bars+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+(H-pb-2)+'" width="'+bw.toFixed(1)+'" height="2" rx="1" fill="rgba(128,140,160,.25)"/>';
    var step=Math.ceil(n/8);
    if(i%step===0)lbls+='<text x="'+x.toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9" fill="#5D6B85" font-family="JetBrains Mono">'+items[i].l+'</text>';
  }
  var tline='';
  if(opts.target){
    var ty=H-pb-(opts.target/max)*(H-pt-pb);
    tline='<line x1="0" x2="'+W+'" y1="'+ty.toFixed(1)+'" y2="'+ty.toFixed(1)+'" stroke="#8A94A6" stroke-dasharray="4 4"/>'+
    '<text x="'+W+'" y="'+(ty-4).toFixed(1)+'" text-anchor="end" font-size="9" fill="#8A94A6" font-family="JetBrains Mono">στόχος '+opts.target+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'">'+tline+bars+lbls+'</svg>';
}
function donut(parts,cBig,cSm){
  var R=52,C=2*Math.PI*R,off=0,segs='';
  for(var i=0;i<parts.length;i++){
    var len=C*parts[i].v;
    segs+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+parts[i].c+'" stroke-width="15" stroke-dasharray="'+Math.max(0,len-2).toFixed(1)+' '+Math.max(0,C-len+2).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 70 70)"/>';
    off+=len;
  }
  return '<svg viewBox="0 0 140 140">'+segs+
  '<text x="70" y="68" text-anchor="middle" font-size="19" font-weight="700" fill="#F2F6FF" font-family="JetBrains Mono">'+cBig+'</text>'+
  '<text x="70" y="85" text-anchor="middle" font-size="8.5" fill="#5D6B85" font-family="JetBrains Mono">'+cSm+'</text></svg>';
}

function lastDays(n){
  var out=[],d0=new Date();
  for(var i=n-1;i>=0;i--){var d=new Date(d0);d.setDate(d0.getDate()-i);out.push({d:d,dk:dkey(d)});}
  return out;
}
function vAnalytics(){
  var range=S.anRange||7,mid=S.member,t=targets(mid),wt=waterTarget(mid);
  var ds=lastDays(range),i;
  var sc=[],en=[],wa=[],sl=[],logged=[];
  for(i=0;i<ds.length;i++){
    var s=scoreOf(mid,ds[i].dk);
    var c=consumedOn(mid,ds[i].dk);
    var lg=peek(mid,ds[i].dk);
    sc.push({l:shortD(ds[i].d),v:s?s.score:null});
    en.push({l:shortD(ds[i].d),v:c?c.k:0});
    wa.push({l:shortD(ds[i].d),v:lg?(lg.water||0):0});
    sl.push({l:shortD(ds[i].d),v:(lg&&lg.sleep!=null)?lg.sleep:null});
    if(lg&&lg.meals&&Object.keys(lg.meals).length)logged.push(ds[i]);
  }
  function avg(a){var s=0;for(var q=0;q<a.length;q++)s+=a[q];return a.length?s/a.length:0;}
  var sv=[];
  for(i=0;i<sc.length;i++){ if(sc[i].v!=null)sv.push(sc[i].v); }
  var avgScore=avg(sv);

  h+='<section class="panel rise span2" style="--i:8"><div class="panel-h"><span class="lbl">Παρατηρήσεις</span><span class="hint">αυτόματη ανάλυση των καταγραφών</span></div>';
  h+=analyticsInsights(mid,avgW,avgSl,mp,t)+'</section></div>';
  return h;
}
function analyticsInsights(mid,avgW,avgSl,mp,t){
  var out=[],i;
  if(avgW&&avgW<waterTarget(mid)*.7)out.push({i:'droplet',t:'Η ενυδάτωση κυμαίνεται κάτω από τον στόχο (μέσος '+frHalf(avgW)+'/'+waterTarget(mid)+' ποτήρια). Κράτα ένα μπουκάλι ορατό στο γραφείο ή την κουζίνα.'});
  if(mp&&mp<t.prot*.8)out.push({i:'bowl',t:'Η μέση πρόσληψη πρωτεΐνης ('+mp+'g) είναι κάτω από τον στόχο ('+t.prot+'g). Ένα επιπλέον γιαούρτι ή αυγό την ημέρα καλύπτει τη διαφορά.'});
  if(avgSl&&avgSl<7)out.push({i:'moon',t:'Ο ύπνος μέσου όρου '+frHalf(avgSl)+' ωρών πιέζει την αποκατάσταση. Στόχος: 30 λεπτά νωρίτερα στο κρεβάτι.'});
  var st=streakOf(mid);
  if(st>=3)out.push({i:'flame',t:'Συνεχόμενες '+st+' μέρες συνέπειας — η σταθερότητα είναι το πιο ισχυρό εργαλείο που έχεις.'});
  var d7=lastDays(7),lg7=0;
  for(i=0;i<d7.length;i++){var lg=peek(mid,d7[i].dk);if(lg&&lg.meals&&Object.keys(lg.meals).length)lg7++;}
  if(lg7>=5)out.push({i:'star',t:'Καταγράφηκαν '+lg7+'/7 μέρες αυτή την εβδομάδα. Εξαιρετική εικόνα για έλεγχο και προσαρμογή.'});
  if(!out.length)out.push({i:'spark',t:'Σημείωνε γεύματα, νερό και ύπνο για μερικές μέρες — οι παρατηρήσεις εδώ γίνονται όλο και πιο προσωπικές.'});
  var h='';
  for(i=0;i<out.length;i++)h+='<div class="ins-row">'+ic(out[i].i,16)+'<span>'+out[i].t+'</span></div>';
  return h;
}

var Picker={

var Super={

        items+='<button class="smcheck" data-act="sm-tog" data-arg="'+S.shopping[i].id+'" aria-label="Τσέκαρισμα">'+ic('check',14)+'</button>';
        items+='<span class="sn">'+esc(S.shopping[i].name)+'</span>';
        items+='<span class="sq">'+esc(S.shopping[i].qty||'')+'</span>';
        items+='<button class="srm" data-act="sm-rm" data-arg="'+S.shopping[i].id+'" aria-label="Διαγραφή">'+ic('trash',14)+'</button></div>';
      }
      if(items)h+='<div class="aisle-h">'+AISLES[a]+'<span></span></div>'+items;
    }
    $('smBody').innerHTML=h;
  },
  tog:function(id){
    for(var i=0;i<S.shopping.length;i++){
      if(S.shopping[i].id===id){
        S.shopping[i].done=!S.shopping[i].done;
        if(S.shopping[i].done){FX.check();vibrate(12);}else FX.tap();
        break;
      }
    }
    save();this.render();updateBadges();
  },
  rm:function(id){
    var nw=[];
    for(var i=0;i<S.shopping.length;i++){ if(S.shopping[i].id!==id)nw.push(S.shopping[i]); }
    S.shopping=nw;FX.un();save();this.render();updateBadges();
  },
  add:function(){
    var name=$('smName').value.trim();
    if(!name){toast('Γράψε πρώτα το προϊόν','info');return;}
    S.shopping.push({id:'c'+Date.now(),name:name,qty:'',aisle:$('smAisle').value,done:false,custom:true});
    $('smName').value='';FX.check();save();this.render();updateBadges();
  },
  regen:function(){
    var agg={},totMult=0,d,s,i;
    for(i=0;i<S.members.length;i++)totMult+=S.members[i].mult;
    for(d=0;d<DAYS.length;d++){
      for(s=0;s<SLOTS.length;s++){
        var r=rec((S.plan[DAYS[d]]||{})[SLOTS[s].id]);
        if(!r)continue;
        for(var j=0;j<r.ing.length;j++){
          agg[r.ing[j][0]]=(agg[r.ing[j][0]]||0)+r.ing[j][1]*totMult;
        }
      }
    }
    var prev=S.shopping;
    var custom=[];
    for(i=0;i<S.shopping.length;i++){ if(S.shopping[i].custom)custom.push(S.shopping[i]); }
    S.shopping=custom;
    for(var fid in agg){
      var fd=FOODS[fid];
      var old=null;
      for(i=0;i<prev.length;i++){ if(!prev[i].custom&&prev[i].name===fd.n)old=prev[i]; }
      S.shopping.push({id:'w_'+fid,name:fd.n,qty:fmtQty(fd,agg[fid]),aisle:fd.a,done:old?old.done:false});
    }
    save();updateBadges();
    if($('smModal').classList.contains('open'))this.render();
    toast('Η λίστα ενημερώθηκε: '+S.shopping.length+' προϊόντα από το πλάνο','cart');
  },
  clearDone:function(){
    var n=0,i;
    for(i=0;i<S.shopping.length;i++){ if(S.shopping[i].done)n++; }
    if(!n){toast('Δεν υπάρχουν τσεκαρισμένα προϊόντα','info');return;}
    var nw=[];
    for(i=0;i<S.shopping.length;i++){ if(!S.shopping[i].done)nw.push(S.shopping[i]); }
    S.shopping=nw;save();this.render();updateBadges();
    toast('Καθαρίστηκαν '+n+' προϊόντα','trash');
  },
  copy:function(){
    var lines=['Λίστα Supermarket — '+fmtDate(),''],z;
    for(var a=0;a<AISLES.length;a++){
      var its=[];
      for(z=0;z<S.shopping.length;z++){ if(S.shopping[z].aisle===AISLES[a]&&!S.shopping[z].done)its.push(S.shopping[z]); }
      if(its.length){
        lines.push(AISLES[a].toUpperCase());
        for(z=0;z<its.length;z++)lines.push('- '+its[z].name+(its[z].qty?' ('+its[z].qty+')':''));
      }
    }
    var txt=lines.join('\n');
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt);
        toast('Η λίστα αντιγράφηκε — επικόλλησέ τη σε μήνυμα','copy');
      }else{
        window.prompt('Αντιγραφή λίστας (Ctrl+C):',txt);
      }
    }catch(e){ window.prompt('Αντιγραφή λίστας (Ctrl+C):',txt); }
  }
};

    list.push({g:'Ενέργειες',t:'Ήχοι: ενεργοποίηση / απενεργοποίηση',icn:'volume',run:function(){toggleSound();}});
    list.push({g:'Ενέργειες',t:'Ξενάγηση εφαρμογής',icn:'info',run:function(){Tour.start();}});
    list.push({g:'Ενέργειες',t:'Ρυθμίσεις',icn:'gear',run:function(){Settings.open();}});

      (function(r){

        run:function(){S.tab='nutrition';S.libOpen=r.id;S.libQ='';S.libCat='all';animateNext=true;save();renderAll();}});
      })(RECIPES[i]);
    }
    return list;
  },
  fz:function(q,s){
    q=q.toLowerCase();s=s.toLowerCase();
    if(!q)return 1;
    var i=0,score=0,streak=0;
    for(var j=0;j<s.length;j++){
      if(s.charAt(j)===q.charAt(i)){i++;score+=1+streak;streak++;}else streak=0;
      if(i===q.length)return score+(s.indexOf(q)>=0?30:0);
    }
    return 0;
  },
  render:function(q){
    var all=this.actions();
    var list=[];
    if(q&&q.trim()){
      var scored=[];
      for(var i=0;i<all.length;i++){
        var sc=this.fz(q.trim(),all[i].t)+((all[i].g==='Πλοήγηση')?2:0);
        if(sc>0)scored.push({a:all[i],s:sc});
      }
      scored.sort(function(x,y){return y.s-x.s;});
      for(i=0;i<scored.length&&i<10;i++)list.push(scored[i].a);
    }else{
      for(i=0;i<all.length&&list.length<10;i++){
        if(all[i].g==='Πλοήγηση'||all[i].g==='Μέλη')list.push(all[i]);
      }
    }
    this.items=list;
    if(this.sel>=list.length)this.sel=Math.max(0,list.length-1);
    var h='';
    for(i=0;i<list.length;i++){
      h+='<button class="pal-item'+(i===this.sel?' sel':'')+'" data-act="pal-exec" data-arg="'+i+'">'+ic(list[i].icn,17);
      h+='<span>'+list[i].t+(list[i].sub?' <small style="color:var(--dim);font-weight:600">· '+list[i].sub+'</small>':'')+'</span>';
      h+='<span class="pg">'+list[i].g+'</span></button>';
    }
    if(!list.length)h='<div class="empty">'+ic('search',26)+'<p>Τίποτα για «'+esc(q)+'».</p></div>';
    $('palList').innerHTML=h;
  },
  move:function(d){
    if(!this.items.length)return;
    this.sel=(this.sel+d+this.items.length)%this.items.length;
    this.render($('palQ').value);
  },
  exec:function(i){
    var a=this.items[i];
    if(!a)return;
    this.close();FX.tap();
    setTimeout(function(){a.run();},50);
  }
};

{icn:'scale',t:'Παρακολούθησε το βάρος σου',d:'Στην «Ανάλυση» υπάρχει πλήρης οθόνη βάρους: ζύγιστρο με δείκτη, BMI, μεταβολές 7 ημερών και πλήρες ιστορικό.'},
{icn:'cart',t:'Πλάνο → Λίστα αγορών',d:'Σχεδίασε την εβδομάδα και πάτα «Λίστα από εβδομάδα». Τα υλικά συγκεντρώνονται αυτόματα, κλιμακωμένα για κάθε μέλος.'},

/* ---- Επεξεργαστής μέλους ---- */
var MemberEditor={
  T:null,delArmed:false,
  open:function(mid){
    this.delArmed=false;
    var src=null,i;
    for(i=0;i<S.members.length;i++){ if(S.members[i].id===mid)src=S.members[i]; }
    if(src)this.T=JSON.parse(JSON.stringify(src));
    else this.T={id:'m'+Date.now(),name:'',role:'Μέλος',color:PALETTE[4].c,theme:PALETTE[4].t,mult:1,athlete:false,sex:'f',age:35,weight:70,height:168,act:1.38,goal:1};
    this.T._edit=!!src;
    $('editTitle').textContent=src?('Επεξεργασία: '+src.name):'Νέο μέλος οικογένειας';
    this.render();
    ovOpen('editModal');
  },
  calc:function(){
    var p=this.T;
    var bmr=Math.round(10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161));
    var kcal=Math.round(bmr*p.act*p.goal/10)*10;
    return{bmr:bmr,kcal:kcal,prot:Math.round((p.athlete?2.0:1.8)*p.weight)};
  },
  setSwatch:function(i){
    this.T.color=PALETTE[i].c;this.T.theme=PALETTE[i].t;this.render();
  },
  field:function(el){
    var f=el.getAttribute('data-f'),v=el.value;
    if(!this.T)return;
    if(f==='name'||f==='role'){this.T[f]=v;return;}
    if(f==='sex'){this.T.sex=v;}
    else if(f==='athlete'){this.T.athlete=(v==='1');}
    else{this.T[f]=parseFloat(v)||0;}
    this.render();
  },
  render:function(){
    var T=this.T;
    var sugg=Math.max(.5,Math.round(this.calc().kcal/2100*10)/10);
    var acts=[[1.2,'Καθιστική'],[1.375,'Ελαφριά δραστηριότητα'],[1.46,'Μέτρια'],[1.55,'Δραστήρια'],[1.725,'Πολύ δραστήρια / αθλητής']];
    var goals=[[.85,'Μείωση βάρους'],[1,'Συντήρηση'],[1.12,'Μάζα & απόδοση']];
    function selOpts(list,val){
      var o='';
      for(var i=0;i<list.length;i++){
        o+='<option value="'+list[i][0]+'"'+(Math.abs(val-list[i][0])<.01?' selected':'')+'>'+list[i][1]+'</option>';
      }
      return o;
    }
    var h='<div class="medit-grid">';
    h+='<div class="full"><label class="flbl">Ονοματεπώνυμο</label><input class="fin" type="text" value="'+esc(T.name)+'" data-f="name"/></div>';
    h+='<div class="full"><label class="flbl">Ρόλος στην οικογένεια</label><input class="fin" type="text" value="'+esc(T.role||'')+'" data-f="role"/></div>';
    h+='<div class="full"><label class="flbl">Χρώμα ταυτότητας</label><div class="swatches">';
    for(var i=0;i<PALETTE.length;i++){
      h+='<button class="swatch'+(T.color===PALETTE[i].c?' on':'')+'" style="background:'+PALETTE[i].c+'" title="'+PALETTE[i].n+'" data-act="swatch" data-arg="'+i+'"></button>';
    }
    h+='</div></div>';
    h+='<div><label class="flbl">Φύλο</label><select class="fin" data-f="sex">';
    h+='<option value="f"'+(T.sex==='f'?' selected':'')+'>Γυναίκα</option>';
    h+='<option value="m"'+(T.sex==='m'?' selected':'')+'>Άνδρας</option></select></div>';
    h+='<div><label class="flbl">Ηλικία</label><input class="fin" type="number" value="'+T.age+'" min="10" max="90" data-f="age"/></div>';
    h+='<div><label class="flbl">Βάρος (kg)</label><input class="fin" type="number" value="'+T.weight+'" min="30" max="180" step="0.5" data-f="weight"/></div>';
    h+='<div><label class="flbl">Ύψος (cm)</label><input class="fin" type="number" value="'+T.height+'" min="130" max="220" data-f="height"/></div>';
    h+='<div><label class="flbl">Δραστηριότητα</label><select class="fin" data-f="act">'+selOpts(acts,T.act)+'</select></div>';
    h+='<div><label class="flbl">Στόχος</label><select class="fin" data-f="goal">'+selOpts(goals,T.goal)+'</select></div>';
    h+='<div><label class="flbl">Συντελεστής μερίδας (προτείνεται ×'+frHalf(sugg)+')</label><input class="fin" type="number" value="'+T.mult+'" min="0.5" max="3" step="0.1" data-f="mult"/></div>';
    h+='<div><label class="flbl">Αθλητής</label><select class="fin" data-f="athlete">';
    h+='<option value="0"'+(!T.athlete?' selected':'')+'>Όχι</option>';
    h+='<option value="1"'+(T.athlete?' selected':'')+'>Ναι — εντατική προπόνηση</option></select></div>';
    h+='</div>';
    h+='<div class="mprev"><div><b>'+this.calc().kcal+'</b><span>kcal/ημέρα</span></div>';
    h+='<div><b>'+this.calc().bmr+'</b><span>BMR</span></div>';
    h+='<div><b>'+this.calc().prot+'g</b><span>πρωτεΐνη</span></div>';
    h+='<div><b>'+Math.max(6,Math.min(12,Math.round(T.weight*(T.athlete?38:33)/250)))+'</b><span>ποτήρια νερού</span></div></div>';
    h+='<div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap">';
    h+='<button class="btn acc" data-act="edit-save">'+ic('check',15)+(T._edit?'Αποθήκευση':'Δημιουργία μέλους')+'</button>';
    if(T._edit)h+='<button class="btn danger" id="delMemBtn" data-act="edit-del">'+ic('trash',15)+'Διαγραφή μέλους</button>';
    h+='<button class="btn" data-act="ov-close" data-arg="editModal">Ακύρωση</button></div>';
    $('editBody').innerHTML=h;
  },
  del:function(){
    if(S.members.length<=1){toast('Πρέπει να υπάρχει τουλάχιστον ένα μέλος','info');return;}
    if(!this.delArmed){
      this.delArmed=true;
      var b=$('delMemBtn');
      if(b)b.innerHTML=ic('info',15)+'Πάτα ξανά για επιβεβαίωση';
      var self=this;
      setTimeout(function(){
        self.delArmed=false;
        var bb=$('delMemBtn');
        if(bb)bb.innerHTML=ic('trash',15)+'Διαγραφή μέλους';
      },2600);
      return;
    }
    var nw=[],i;
    for(i=0;i<S.members.length;i++){ if(S.members[i].id!==this.T.id)nw.push(S.members[i]); }
    S.members=nw;
    if(S.member===this.T.id)S.member=S.members[0].id;
    save();ovClose('editModal');renderAll();
    toast('Το μέλος διαγράφηκε','trash');
  },
  save:function(){
    var T=this.T;
    if(!T.name||!T.name.trim()){toast('Δώσε πρώτα το όνομα','info');return;}
    if(!(T.age>0&&T.weight>0&&T.height>0)){toast('Συμπλήρωσε ηλικία, βάρος και ύψος','info');return;}
    if(!T.mult||T.mult<.5)T.mult=Math.max(.5,Math.round(this.calc().kcal/2100*10)/10);
    var data={id:T.id,name:T.name.trim(),role:(T.role||'Μέλος').trim(),color:T.color,theme:T.theme,mult:T.mult,athlete:T.athlete,quote:T.quote||'',sex:T.sex,age:T.age,weight:T.weight,height:T.height,act:T.act,goal:T.goal};
    var target=null,i;
    for(i=0;i<S.members.length;i++){ if(S.members[i].id===T.id)target=S.members[i]; }
    if(T._edit&&target)Object.assign(target,data);
    else{S.members.push(data);S.member=T.id;}
    save();ovClose('editModal');FX.check();renderAll();
    toast(T._edit?'Το προφίλ ενημερώθηκε':'Καλώς ήρθες, '+esc(data.name)+'!','users');
  }
};

        self.resetArmed=false;

        if(bb)bb.innerHTML=ic('trash',14)+'Επαναφορά';
      },3000);
      return;
    }
    try{localStorage.removeItem(KEY);}catch(e){}
    location.reload();

/* ---- Διακρίσεις ---- */
function evalAch(){
  var unlocked=[];
  function anyComplete(mid){
    var dks=Object.keys(S.logs);
    for(var i=0;i<dks.length;i++){
      if(allMealsDone(peek(mid,dks[i])))return true;
    }
    return false;
  }
  var maxStreak=0,i;
  for(i=0;i<S.members.length;i++){
    var st=streakOf(S.members[i].id);
    if(st>maxStreak)maxStreak=st;
  }
  var hydDays=0;
  for(i=0;i<S.members.length;i++){
    var dks=Object.keys(S.logs);
    for(var z=0;z<dks.length;z++){
      var lg=peek(S.members[i].id,dks[z]);
      if(lg&&(lg.water||0)>=waterTarget(S.members[i].id))hydDays++;
    }
  }
  var famDay=false;
  var dks2=Object.keys(S.logs);
  for(i=0;i<dks2.length;i++){
    var all=true;
    for(var y=0;y<S.members.length;y++){
      if(!allMealsDone(peek(S.members[y].id,dks2[i])))all=false;
    }
    if(all){famDay=true;break;}
  }
  var planFull=true;
  for(i=0;i<DAYS.length;i++){
    for(var s=0;s<SLOTS.length;s++){
      if(!(S.plan[DAYS[i]]||{})[SLOTS[s].id])planFull=false;
    }
  }
  var zenith=false;
  for(i=0;i<dks2.length;i++){
    for(var m2=0;m2<S.members.length;m2++){
      var sc=scoreOf(S.members[m2].id,dks2[i]);
      if(sc&&sc.score>=100)zenith=true;
    }
  }
  var firstAny=false;
  for(i=0;i<S.members.length;i++){ if(anyComplete(S.members[i].id))firstAny=true; }
  var cond={
    first:firstAny,
    st3:maxStreak>=3,st7:maxStreak>=7,st14:maxStreak>=14,st30:maxStreak>=30,
    hyd5:hydDays>=5,fam:famDay,
    exp:(S.stats.recOpen||[]).length>=10,plan:planFull,
    wk10:(S.stats.workouts||0)>=10,zenith:zenith,
    act30:Object.keys(S.stats.days||{}).length>=30
  };
  for(i=0;i<ACH.length;i++){
    if(cond[ACH[i].id]&&!S.ach[ACH[i].id]){
      S.ach[ACH[i].id]=todayKey();
      unlocked.push(ACH[i]);
    }
  }
  if(unlocked.length){
    save();
    for(i=0;i<unlocked.length;i++){
      (function(a,idx){
        setTimeout(function(){toast('Διάκριση: '+a.t,'trophy');},idx*600);
      })(unlocked[i],i);
    }
    FX.done();vibrate([40,50,80]);
  }
}

/* ---- Backup ---- */
var Backup={
  export:function(){
    try{
      var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='zenith-backup-'+todayKey()+'.json';
      a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
      toast('Το backup κατέβηκε ως αρχείο JSON','download');
    }catch(e){toast('Δεν ήταν δυνατή η εξαγωγή','info');}
  },
  trigger:function(){var f=$('fileInp');if(f)f.click();},
  import:function(ev){
    var f=ev.target.files&&ev.target.files[0];
    if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var p=JSON.parse(r.result);
        if(!p.members||!p.plan||!p.logs)throw new Error('bad');
        S=deepMerge(defaultState(),p);
        S.stats=Object.assign({recOpen:[],workouts:0,days:{}},p.stats||{});
        S.tourDone=true;
        save();renderAll();evalAch();
        toast('Τα δεδομένα επαναφέρθηκαν επιτυχώς','upload');
      }catch(e){toast('Το αρχείο δεν φαίνεται έγκυρο backup του ZENITH PRO','info');}
    };
    r.readAsText(f);
    ev.target.value='';
  }
};
</script>

<script>
/* ============ BLOCK C · Events + Render + Boot ============ */
'use strict';
function actEl(t){
  while(t&&t!==document){
    if(t.getAttribute&&t.getAttribute('data-act'))return t;
    t=t.parentNode;
  }
  return null;
}
function handleAct(act,a,b,el,ev){
  switch(act){
    case 'nop':break;
    case 'ov-bg':
      if(a==='tourModal')Tour.end();else ovClose(a);
      break;
    case 'ov-close':ovClose(a);break;
    case 'go':go(a);break;
    case 'member':setMember(a);break;
    case 'meal':toggleMeal(a,ev);break;
    case 'water':cupTap(parseInt(a,10));break;
    case 'water-add':addWater(parseFloat(a));break;
    case 'bio':setBio(a);break;
    case 'sleep':addSleep(parseFloat(a));break;
    case 'swap':Picker.open('swap',a);break;
    case 'slot':Picker.open('plan',a,b);break;
    case 'rec':toggleRec(a);break;
    case 'fav':toggleFav(a);break;
    case 'rec-list':recToList(a);break;
    case 'pot':setPot(a);break;
    case 'ex':toggleEx(parseInt(a,10),ev);break;
    case 'ex-reset':resetEx();break;
    case 'timer-preset':Timer.preset(parseInt(a,10));break;
    case 'timer-adj':Timer.adj(parseInt(a,10));break;
    case 'timer-toggle':Timer.toggle();break;
    case 'timer-reset':Timer.reset();break;
    case 'autofill':autofill();break;
    case 'clear-week':clearWeek(el);break;
    case 'sm-open':Super.open();break;
    case 'sm-regen':Super.regen();break;
    case 'sm-regen-open':Super.regen();Super.open();break;
    case 'sm-clear':Super.clearDone();break;
    case 'sm-copy':Super.copy();break;
    case 'sm-print':window.print();break;
    case 'sm-add':Super.add();break;
    case 'sm-tog':Super.tog(a);break;
    case 'sm-rm':Super.rm(a);break;
    case 'pick':Picker.pick(a);break;
    case 'pal-open':Palette.open();break;
    case 'pal-exec':Palette.exec(parseInt(a,10));break;
    case 'tour-start':Tour.start();break;
    case 'tour-next':Tour.next();break;
    case 'tour-end':Tour.end();break;
    case 'edit-open':MemberEditor.open(a||null);break;
    case 'swatch':MemberEditor.setSwatch(parseInt(a,10));break;
    case 'edit-save':MemberEditor.save();break;
    case 'edit-del':MemberEditor.del();break;
    case 'set-open':Settings.open();break;
    case 'set-reset':Settings.reset();break;
    case 'bk-export':Backup.export();break;
    case 'bk-import':Backup.trigger();break;
    case 'sound-toggle':
      toggleSound();
      if($('setModal').classList.contains('open'))Settings.render();
      break;
    case 'remind-toggle':
      S.remind=!S.remind;
      if(S.remind){
        if(!('Notification' in window)){toast('Οι ειδοποιήσεις δεν υποστηρίζονται σε αυτή τη συσκευή','info');S.remind=false;}
        else if(Notification.permission==='denied'){toast('Οι ειδοποιήσεις είναι αποκλεισμένες από τον browser','info');S.remind=false;}
        else if(Notification.permission==='default'){
          Notification.requestPermission().then(function(p){
            if(p!=='granted'){toast('Ενεργοποίησέ τες για να λάβεις υπενθυμίσεις','info');S.remind=false;}
            else toast('Η υπενθύμιση ενεργοποιήθηκε','bell');
            save();if($('setModal').classList.contains('open'))Settings.render();
          });
        }else toast('Η υπενθύμιση ενεργοποιήθηκε','bell');
      }else toast('Η υπενθύμιση απενεργοποιήθηκε','bellOff');
      save();if($('setModal').classList.contains('open'))Settings.render();
      break;
    case 'an-range':S.anRange=parseInt(a,10);save();renderView();break;
    case 'lib-cat':S.libCat=a;save();renderView();break;
    case 'lib-fav':S.libCat=(S.libCat==='fav')?'all':'fav';save();renderView();break;
    case 'weight-log':logWeight();break;
    case 'w-rm':rmWeight(a);break;
    case 'w-enter':
      if(ev&&ev.key==='Enter')logWeight();
      break;
  }
}
document.addEventListener('click',function(ev){
  try{
    var el=actEl(ev.target);
    if(!el)return;
    handleAct(el.getAttribute('data-act'),el.getAttribute('data-arg'),el.getAttribute('data-arg2'),el,ev);
  }catch(e){fatal('click: '+(e.message||e));}
});
document.addEventListener('keydown',function(ev){
  try{
    var el=actEl(ev.target);
    if(el&&el.getAttribute('data-act')==='w-enter'&&ev.key==='Enter'){logWeight();return;}
  }catch(e){}
});
document.addEventListener('input',function(ev){
  try{
    var el=actEl(ev.target);
    if(!el)return;
    var act=el.getAttribute('data-act');
    if(act==='lib-q')libSearch(el.value);
    else if(act==='pick-q')Picker.render(el.value);
    else if(act==='pal-q')Palette.render(el.value);
    else if(act==='orm-w'||act==='orm-r')onermUpd();
    else if(el.getAttribute('data-f')&&typeof MemberEditor!=='undefined')MemberEditor.field(el);
  }catch(e){fatal('input: '+(e.message||e));}
});
document.addEventListener('change',function(ev){
  try{
    var el=actEl(ev.target);
    if(!el)return;
    var act=el.getAttribute('data-act');
    if(act==='pot-sel'){S.potRec=el.value;save();renderView();}
    else if(act==='practice'){S.practice=el.value;save();renderView();}
    else if(act==='remind-time'){S.remindTime=el.value;save();}
    else if(act==='bk-file')Backup.import(ev);
    else if(el.getAttribute('data-f')&&typeof MemberEditor!=='undefined')MemberEditor.field(el);
  }catch(e){fatal('change: '+(e.message||e));}
});
function closeTopModal(){
  var ids=['palModal','pickModal','smModal','editModal','setModal','tourModal'];
  for(var i=ids.length-1;i>=0;i--){
    var el=$(ids[i]);
    if(el&&el.classList.contains('open')){
      if(ids[i]==='palModal')Palette.close();
      else if(ids[i]==='tourModal')Tour.end();
      else ovClose(ids[i]);
      return;
    }
  }
}
document.addEventListener('keydown',function(e){
  try{
    if((e.metaKey||e.ctrlKey)&&String(e.key||'').toLowerCase()==='k'){
      e.preventDefault();
      if(Palette.openState)Palette.close();else Palette.open();
      return;
    }
    if(Palette.openState){
      if(e.key==='ArrowDown'){e.preventDefault();Palette.move(1);}
      else if(e.key==='ArrowUp'){e.preventDefault();Palette.move(-1);}
      else if(e.key==='Enter'){e.preventDefault();Palette.exec(Palette.sel);}
      else if(e.key==='Escape')Palette.close();
      return;
    }
    if(e.key==='Enter'){
      var el=actEl(e.target);
      if(el&&el.getAttribute('data-act')==='sm-name'){Super.add();return;}
    }
    var tag=(e.target&&e.target.tagName)||'';
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
    if(e.key==='Escape'){closeTopModal();return;}
    var tabs=['dashboard','nutrition','fitness','planner','analytics','family'];
    if(e.key>='1'&&e.key<='6')go(tabs[parseInt(e.key,10)-1]);
  }catch(e2){fatal('key: '+(e2.message||e2));}
});

/* ---- Render ---- */
function renderRail(){
  var h='<div class="brand"><div class="brand-mark">'+ic('zap',22)+'</div><div><h1>ZENITH PRO</h1><small>Spatial Nutrition OS</small></div></div>';
  h+='<div class="rsec">Πλοήγηση</div>';
  var keys=Object.keys(TABS);
  for(var i=0;i<keys.length;i++){
    h+='<button class="rnav'+(S.tab===keys[i]?' on':'')+'" data-act="go" data-arg="'+keys[i]+'">'+ic(TABS[keys[i]].icon,18)+'<span>'+TABS[keys[i]].label+'</span></button>';
  }
  h+='<div class="rsec">Εργαλεία</div>';
  h+='<button class="rnav" data-act="sm-open">'+ic('cart',18)+'<span>Λίστα Αγορών</span><span class="cnt" id="railBadge">0</span></button>';
  h+='<button class="rnav" data-act="pal-open">'+ic('command',18)+'<span>Έξυπνο Μενού</span><span class="kbd" style="font-size:9px">⌘K</span></button>';
  h+='<button class="rnav" data-act="set-open">'+ic('gear',18)+'<span>Ρυθμίσεις</span></button>';
  h+='<button class="rnav" data-act="tour-start">'+ic('info',18)+'<span>Ξενάγηση</span></button>';
  h+='<div class="rail-foot"><p><b>Tip:</b> Πλήκτρα <span class="kbd">1</span>–<span class="kbd">6</span> για καρτέλες, <span class="kbd">⌘K</span> για έξυπνο μενού. Τα δεδομένα μένουν αποθηκευμένα στη συσκευή σου.</p></div>';
  $('rail').innerHTML=h;
}
function renderDock(){
  var cartN=0,i;
  for(i=0;i<S.shopping.length;i++){ if(!S.shopping[i].done)cartN++; }
  var h='',keys=Object.keys(TABS);
  for(i=0;i<keys.length;i++){
    h+='<button class="'+(S.tab===keys[i]?'on':'')+'" data-act="go" data-arg="'+keys[i]+'">'+ic(TABS[keys[i]].icon,19)+'<span>'+TABS[keys[i]].dock+'</span></button>';
  }
  h+='<button data-act="sm-open">'+ic('cart',19)+'<span>Ψώνια</span>'+(cartN?'<span class="dbadge">'+cartN+'</span>':'')+'</button>';
  $('dock').innerHTML=h;
}
function renderTopbar(){
  var h='<button class="searchpill" data-act="pal-open">'+ic('search',15)+'<span>Αναζήτηση ή ενέργεια</span><span class="kbd">⌘K</span></button>';
  h+='<button class="btn ibtn hm" data-act="sound-toggle" title="Ήχοι">'+ic(S.sound?'volume':'volumeOff',17)+'</button>';
  h+='<button class="btn ibtn hm" data-act="tour-start" title="Ξενάγηση">'+ic('info',17)+'</button>';
  h+='<button class="btn ibtn hm" data-act="set-open" title="Ρυθμίσεις">'+ic('gear',17)+'</button>';
  h+='<button class="btn ibtn hm" data-act="bk-export" title="Εξαγωγή backup">'+ic('download',17)+'</button>';
  h+='<button class="btn ibtn hm" data-act="bk-import" title="Εισαγωγή backup">'+ic('upload',17)+'</button>';
  h+='<button class="btn acc" data-act="sm-open">'+ic('cart',16)+'<span>Λίστα</span><span class="mono" id="cartBadge">0</span></button>';
  $('tbActions').innerHTML=h;
}
function renderTitle(){
  var kick='<div class="kicker"><span class="beacon"></span> Family Nutrition OS · Spatial Edition</div>';
  if(S.tab==='dashboard'){
    var m=member();
    $('titleBlock').innerHTML=kick+
    '<h1>'+greeting()+', <em>'+esc(m.name)+'</em>.</h1><div class="sub">'+esc(m.quote||m.role||'')+'</div>';
  }else{
    $('titleBlock').innerHTML=kick+'<h1>'+TABS[S.tab].title+'</h1><div class="sub">'+TABS[S.tab].sub+'</div>';
  }
}
function renderView(){
  var VIEWS={dashboard:vDashboard,nutrition:vNutrition,fitness:vFitness,planner:vPlanner,analytics:vAnalytics,family:vFamily};
  var fn=VIEWS[S.tab]||vDashboard;
  try{
    $('view').innerHTML=fn();
  }catch(e){
    $('view').innerHTML='<div class="empty">'+ic('info',30)+'<p>Πρόβλημα απεικόνισης καρτέλας:<br>'+esc(e.message||String(e))+'</p></div>';
    fatal('Render: '+(e.message||e));
  }
  afterRender();
}
function afterRender(){
  var els=qsa('[data-w]'),i;
  for(i=0;i<els.length;i++)els[i].style.width=els[i].getAttribute('data-w')+'%';
  els=qsa('[data-h]');
  for(i=0;i<els.length;i++)els[i].style.height=els[i].getAttribute('data-h')+'%';
  var gv=$('gaugeVal');
  if(gv){
    var target=gv.getAttribute('data-off');
    requestAnimationFrame(function(){requestAnimationFrame(function(){gv.style.strokeDashoffset=target;});});
  }
  var sn=$('scoreNum');
  if(sn)countUp(sn,parseInt(sn.getAttribute('data-to'),10));
  animateNext=false;
}
function updateBadges(){
  var n=0,i;
  for(i=0;i<S.shopping.length;i++){ if(!S.shopping[i].done)n++; }
  if($('cartBadge'))$('cartBadge').textContent=n;
  if($('railBadge'))$('railBadge').textContent=n;
  renderDock();
}
function renderAll(){
  document.body.setAttribute('data-theme',member().theme||'emerald');
  $('crumbLbl').textContent=TABS[S.tab].label.toUpperCase();
  $('dateLbl').textContent=fmtDate();
  renderRail();renderTopbar();renderTitle();renderView();updateBadges();
}
function tickClock(){
  var c=$('clockLbl');
  if(c){
    var d=new Date();
    c.textContent=pad2(d.getHours())+':'+pad2(d.getMinutes());
  }
}
function boot(){
  if(typeof vDashboard!=='function'){
    throw new Error('Η ενότητα προβολών (Block B) δεν φορτώθηκε.');
  }
  sizeCanvas();
  addEventListener('resize',sizeCanvas);
  tickClock();setInterval(tickClock,5000);
  /* Deep-link: support ?tab=... and #tab shortcuts (PWA shortcuts use ?tab=) */
  try{
    var qp=new URLSearchParams(location.search),tab=qp.get('tab');
    if(tab&&TABS[tab]){S.tab=tab;save();}
  }catch(e){}
  /* PWA: register service worker for offline-first + installability */
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  /* Daily reminder scheduler: fires once per day at remindTime if meals are pending */
  var remindFired=null;
  function tryRemind(){
    try{
      if(!S.remind||!('Notification' in window)||Notification.permission!=='granted')return;
      var now=new Date(),cur=pad2(now.getHours())+':'+pad2(now.getMinutes());
      if(cur!==S.remindTime)return;
      if(remindFired===todayKey())return;
      var lg=logOf(),pending=0;
      var sks=Object.keys(lg.meals);
      for(var i=0;i<sks.length;i++){ if(!lg.meals[sks[i]])pending++; }
      if(pending>0){
        remindFired=todayKey();
        var name=member().name;
        try{new Notification('ZENITH PRO · '+name,{body:'Απομένουν '+pending+' γεύματα να καταγράψεις σήμερα. Καλή συνέχεια! 💪',icon:'assets/icon-192.png',tag:'zenith-remind',renotify:true});}catch(e){}
      }
    }catch(e){}
  }
  tryRemind();
  setInterval(tryRemind,20000);
  renderAll();
  save();
  evalAch();
  $('view').setAttribute('data-ready','1');
  if(!S.tourDone)setTimeout(function(){Tour.start();},700);
}
try{ boot(); }
catch(e){ fatal('Εκκίνηση: '+(e&&e.message?e.message:String(e))); }
</script>
