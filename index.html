<!doctype html>
<html lang="el" data-theme="light" data-theme-pref="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZENITH PRO · Οικογενειακή Διατροφή</title>

<meta name="description" content="ZENITH PRO — οικογενειακό σύστημα διατροφής που δουλεύει εκτός σύνδεσης. Μερίδες ανά μέλος, πλάνο 28 ημερών, λίστα αγορών, καταγραφή και τάσεις. Θρεπτικά υπολογισμένα από τα υλικά με πηγές USDA, EFSA και ΠΟΥ. Ιδιωτικότητα από προεπιλογή: όλα τα δεδομένα μένουν στη συσκευή.">
<meta name="author" content="douphealth">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070C09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZENITH PRO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">

<!-- Everything the app loads is its own: no third-party origin can run script or
     receive a request. Inline style attributes are used by the views, so styles
     allow 'unsafe-inline'; scripts do not. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

<meta property="og:type" content="website">
<meta property="og:title" content="ZENITH PRO · Οικογενειακό Σύστημα Διατροφής">
<meta property="og:description" content="Ένα μενού για όλη την οικογένεια, μερίδες ανά μέλος. Λειτουργεί εκτός σύνδεσης, χωρίς λογαριασμό και χωρίς διακομιστή.">
<meta property="og:locale" content="el_GR">
<meta property="og:image" content="https://douphealth.github.io/family-nutrition-os/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://douphealth.github.io/family-nutrition-os/assets/og-image.png">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png" sizes="any">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">

<!-- Sets data-theme from the saved choice or the device before first paint,
     so a dark-mode phone never flashes white. -->
<script src="src/theme-boot.js?v=16.0.0"></script>

<link rel="preload" href="assets/fonts/inter-greek-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/tokens.css?v=16.0.0">
<link rel="stylesheet" href="styles/base.css?v=16.0.0">
<link rel="stylesheet" href="styles/components.css?v=16.0.0">
<link rel="stylesheet" href="styles/views.css?v=16.0.0">
<link rel="stylesheet" href="styles/revamp.css?v=16.0.0">
<link rel="stylesheet" href="styles/print.css?v=16.0.0" media="print">
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<a class="sr-only" href="#view">Μετάβαση στο περιεχόμενο</a>

<div class="app">

  <div class="sidebar">
    <header class="brand">
      <span id="brandMark"></span>
      <span class="brand-text">
        <span class="brand-name">ZENITH <b>PRO</b></span>
        <span class="brand-sub">Οικογενειακή διατροφή</span>
      </span>
    </header>

    <nav class="nav" id="sideNav" aria-label="Κύρια πλοήγηση"></nav>

    <footer class="side-foot">
      <p class="side-card">
        <b>Ιδιωτικότητα από προεπιλογή.</b> Τα δεδομένα μένουν σε αυτή τη συσκευή —
        χωρίς λογαριασμό, χωρίς διακομιστή, χωρίς παρακολούθηση. Εκπαιδευτικό εργαλείο ευεξίας, όχι ιατρική φροντίδα.
      </p>
      <div class="side-ver" id="sideVer"></div>
    </footer>
  </div>

  <main class="main">
    <div class="topbar">
      <div class="topbar-in">
        <div class="member-strip" id="memberStrip" role="group" aria-label="Επιλογή μέλους οικογένειας"></div>
        <div class="spacer"></div>
        <button type="button" class="icon-btn" id="paletteBtn" data-act="palette" aria-label="Γρήγορες εντολές (Ctrl+K)"></button>
        <button type="button" class="lang-btn" id="langBtn" data-act="lang" aria-label="Αλλαγή στα Αγγλικά">EN</button>
        <button type="button" class="icon-btn" id="themeBtn" data-act="theme" aria-label="Αλλαγή θέματος"></button>
      </div>
    </div>

    <div id="view" class="content" tabindex="-1"></div>
  </main>

</div>

<nav class="tabbar" id="tabbar" aria-label="Πλοήγηση κινητού"></nav>

<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="sheet" class="hidden"></div>
<div id="palette" class="hidden"></div>

<input id="backupImport" type="file" accept="application/json" class="hidden" aria-hidden="true" tabindex="-1">

<noscript>
  <div class="content">
    <section class="notice notice-warn">
      <b>Χρειάζεται JavaScript.</b>
      Το ZENITH PRO εκτελεί όλους τους υπολογισμούς τοπικά στη συσκευή σου, χωρίς διακομιστή.
      Ενεργοποίησε τη JavaScript για να λειτουργήσει.
    </section>
  </div>
</noscript>

<script type="module" src="src/app.js?v=16.0.0"></script>
</body>
</html>
